[package]
name = "lumalink"
version = "0.2.0"
description = "System MIDI and NDI routing utility"
authors = ["Elicasta"]
edition = "2021"

[lib]
name = "lumalink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.11"
libloading = "0.8"
uuid = { version = "1", features = ["v4"] }
